name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release files
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and check
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "twine>=6.1"
          python -m build
          python -m twine check --strict dist/*

      - name: Tag, package version and changelog must agree
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # The package directory wins over the repo-root playlist_sync.py on import
          version=$(python -c "import playlist_sync; print(playlist_sync.__version__)")
          echo "tag: ${tag}  __version__: ${version}"
          if [ -z "$version" ] || [ "$tag" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi
          test -f "dist/ytmusic_to_spotify_sync-${version}-py3-none-any.whl"
          test -f "dist/ytmusic_to_spotify_sync-${version}.tar.gz"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [${version}] section"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
